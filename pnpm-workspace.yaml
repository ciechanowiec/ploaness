# Workspace linking is local; published packages use exact cross-package versions.
packages:
  - packages/*

linkWorkspacePackages: true

engineStrict: true

onlyBuiltDependencies: []

allowBuilds:
  esbuild: false

minimumReleaseAgeStrict: true

overrides:
  deepmerge-ts: '^8.0.2'
  # GHSA-2883-xcg3-v3hh: below 4.3.2, js-yaml does not bound the CPU an empty merge source can cost.
  # Nothing in this workspace declares js-yaml, so the advisory reaches the tree through a dependent
  # that has not released a fix above it - the one case an override is for. The upper bound is the
  # load-bearing half: written as a bare `>=4.3.2` floor this resolves to the newest release in
  # existence, which is a different package once the major moves.
  js-yaml: '>=4.3.2 <5'
  # GHSA-g3hv-75wg-m249: below 11.0.1, minimatch can spend exponential time expanding globstar parts.
  # ESLint, its config array, typescript-estree, sonarjs and type-coverage all declare ^10, and no 10.x
  # carries the fix. Each calls only the Minimatch constructor, match() and minimatch() with options 11
  # retains; 11 removed makeRe, regexp, AST and matchOne, which none of them reaches.
  minimatch: '>=11.0.1 <12'
