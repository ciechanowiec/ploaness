packages:
  - packages/*

# Link the sibling packages from the workspace during development. The published versions resolve
# normally from the registry, because the packages declare each other at an exact version rather than
# through the `workspace:*` protocol: that protocol does not resolve when a package is installed from a
# tarball outside its workspace, which is exactly how ploaness is verified before it is published.
linkWorkspacePackages: true

engineStrict: true

# deepmerge-ts 7 has a stack-exhaustion advisory (GHSA-ggr8-5vv4-36mx) and eslint-plugin-functional,
# which is on its latest release, still declares `^7.1.5`. The standard resolves a finding by upgrading
# the package and reaches for an allowlist only when no upgrade exists, so the patched major is forced
# here rather than recorded as an exception. Remove this once the plugin declares 8.
overrides:
  deepmerge-ts: '^8.0.2'
