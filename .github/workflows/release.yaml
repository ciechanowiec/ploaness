name: 'Publish npm release'

# The six packages are one release. They pin each other at an exact version, so a run that publishes
# some of them leaves `ploaness` installable and unresolvable - which is why the order below is the
# dependency order, and why nothing is published before the whole verification passes.
#
# The count is stated here and checked elsewhere. This list was written when there were five packages
# and stayed at five when `@ploaness/runtime` arrived, so a release would have published every package
# that pins runtime and never runtime itself - the precise failure the paragraph above describes, left
# open by the paragraph above. `scripts/lib/check-release-version.ts` now reads this list against the
# packages that actually exist, because a comment is not a check.
#
# Authentication is npm trusted publishing (OIDC), not a token. npm revoked classic tokens in
# December 2025 and caps a write-enabled granular token at ninety days, so a stored credential is a
# chore that expires. The `id-token: write` permission below is what replaces it, and it also
# produces the provenance attestation linking each tarball to this workflow and this commit.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version already declared in packages/ploaness/package.json'
        required: true
        default: '1.1.0'
        type: string
      publish:
        description: 'Publish permanently after verification'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: 'npm-release'
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Dependency order, and the one statement of which packages a release is. The publish step
      # walks it forward so the registry never holds a package whose siblings it cannot resolve,
      # and the smoke test walks it again to wait for each one, so the two cannot disagree about
      # what was released. `scripts/lib/check-release-version.ts` reads this line.
      PUBLISH_ORDER: 'ploaness-runtime ploaness-governance ploaness-assets ploaness-config ploaness-cli ploaness'
    steps:
      # The full history, because three gates read it: `require-full-history` refuses a shallow
      # clone outright, `commit-history` judges every message, and the secret scan runs gitleaks in
      # git mode over every commit.
      - name: 'Checkout complete history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Validate release request'
        env:
          CONFIRM_PUBLISH: ${{ inputs.publish }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          if [ "$CONFIRM_PUBLISH" != 'true' ]; then
            echo 'Permanent publication was not confirmed.' >&2
            exit 1
          fi
          # A prerelease and a build identifier are both admitted, because npm supports them. What
          # is rejected is anything that is not a semantic version at all: npm publishes whatever
          # it is given, and a published version can never be replaced.
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$RELEASE_VERSION" =~ $semver ]]; then
            echo 'The release version must be a semantic version.' >&2
            exit 1
          fi
          # npm mints a provenance attestation only for a package published from a PUBLIC
          # repository, and the publish step below asks for one. Asked here, the failure names its
          # reason; asked by npm, it arrives partway down the list, after the tarballs before it have
          # been published and can never be replaced.
          if [ "$IS_PRIVATE" != 'false' ]; then
            echo 'Provenance needs a public repository. Make it public, or drop --provenance.' >&2
            exit 1
          fi

      # Before setup-node, so the dependency cache can key on the pnpm lockfile. The pnpm version
      # comes from `packageManager` in package.json rather than from a literal here, which is one
      # fewer pair of values that must stay equal.
      - name: 'Install pnpm'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 'Set up Node from .nvmrc'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # No `registry-url` above, deliberately: setup-node would write an .npmrc line binding the
      # registry to NODE_AUTH_TOKEN, and an empty token there fails authentication BEFORE the OIDC
      # exchange is attempted. The default registry is already registry.npmjs.org.
      #
      # Trusted publishing needs npm 11.5.1 or newer, which is the one thing the bundled npm is not
      # guaranteed to be. Asking for it explicitly turns a confusing failure at publish time into a
      # version printed at the top of the log.
      - name: 'Install an npm that can publish with OIDC'
        run: |
          set -eu
          npm install --global npm@latest
          npm --version

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      # Two questions, asked before anything is built. Whether this commit declares the version
      # being released - `pnpm run verify` proves the other ten sites agree with it, so only the
      # meta package is compared here. And whether npm already has it: a published version is
      # immutable, so a re-run after a partial failure has to be able to recover the tag and the
      # GitHub Release without attempting a publication that cannot succeed.
      #
      # A third answer falls out of the second: WHICH commit the release is. When this run
      # publishes, it is this one. When npm already holds the version, it is whatever commit the
      # earlier run published from, and this run is only a later commit that happens to be
      # recovering - the 1.1.0 re-run was the fix to the smoke test, and it failed because the tag
      # step compared `v1.1.0` against the fix commit and found it "already identifies another
      # commit". So on the recovery path the commit is read from the provenance attestation npm
      # holds for the version, which is the one record of that fact that neither git nor this
      # workflow can have drifted from. The registry serves no `gitHead` for a package published
      # from a tarball, so the attestation is not merely the better source but the only one.
      - name: 'Validate declared version and registry state'
        id: release_state
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          declared="$(node -p "require('./packages/ploaness/package.json').version")"
          if [ "$declared" != "$RELEASE_VERSION" ]; then
            echo "packages/ploaness/package.json declares $declared, not $RELEASE_VERSION." >&2
            exit 1
          fi
          version_url="https://registry.npmjs.org/ploaness/$RELEASE_VERSION"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$version_url")"
          if [ "$status" = '200' ]; then
            attestations_url="https://registry.npmjs.org/-/npm/v1/attestations/ploaness@$RELEASE_VERSION"
            release_commit="$(curl --silent --fail "$attestations_url" | node -e '
              let body = ""
              process.stdin.on("data", (chunk) => { body += chunk }).on("end", () => {
                const slsa = "https://slsa.dev/provenance/v1"
                const commits = JSON.parse(body).attestations
                  .filter((attestation) => attestation.predicateType === slsa)
                  .map((attestation) => JSON.parse(Buffer.from(attestation.bundle.dsseEnvelope.payload, "base64").toString()))
                  .flatMap((statement) => statement.predicate.buildDefinition.resolvedDependencies ?? [])
                  .map((dependency) => dependency.digest?.gitCommit)
                  .filter((commit) => typeof commit === "string")
                process.stdout.write(commits[0] ?? "")
              })')"
            if [ -z "$release_commit" ]; then
              echo "npm holds ploaness@$RELEASE_VERSION with no provenance naming its commit, so the tag cannot be recovered." >&2
              exit 1
            fi
            echo 'registry_published=true' >> "$GITHUB_OUTPUT"
            echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
            echo "npm already contains ploaness@$RELEASE_VERSION, published from $release_commit; recovering GitHub metadata."
            exit 0
          fi
          if [ "$status" != '404' ]; then
            echo "The npm availability check returned HTTP $status." >&2
            exit 1
          fi
          echo 'registry_published=false' >> "$GITHUB_OUTPUT"
          echo "release_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # The whole verification, not a subset: the build, the type check, both lint passes, the unit
      # suite, every repository-scope gate, the packaging checks over the packed tarballs, and the
      # consumer fixtures. It also leaves dist-tarballs/ populated, which is what the next step
      # publishes - the artefacts that were verified, rather than a second pack nobody checked.
      - name: 'Run verification'
        if: steps.release_state.outputs.registry_published != 'true'
        run: pnpm run verify

      # In PUBLISH_ORDER, because npm does not check that a dependency exists at publish time, so
      # nothing but that order prevents a window in which `ploaness` installs and then fails.
      #
      # `--provenance` is explicit rather than left to the trusted-publishing default, because the
      # attestation is the point: it states which workflow, at which commit, produced this tarball.
      # Access is public through each manifest's `publishConfig`, so it is not restated here.
      - name: 'Publish the verified tarballs'
        id: publish
        if: steps.release_state.outputs.registry_published != 'true'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          for package in $PUBLISH_ORDER; do
            # The leading `./` is load-bearing. npm classifies an argument by shape before it
            # touches the filesystem, and a bare `a/b` is a GitHub shorthand rather than a path,
            # so `npm publish dist-tarballs/x.tgz` resolves github.com/dist-tarballs/x.tgz and
            # hangs on SSH retries. It fails slowly and reads as a network fault, which is why
            # the first hand-run release lost several minutes to it.
            tarball="./dist-tarballs/$package-$RELEASE_VERSION.tgz"
            if [ ! -f "$tarball" ]; then
              echo "The verification produced no $tarball." >&2
              exit 1
            fi
            echo "Publishing $tarball"
            npm publish "$tarball" --provenance
          done

      - name: 'Create and push release tag'
        id: release_tag
        if: >-
          steps.release_state.outputs.registry_published == 'true' ||
          steps.publish.outcome == 'success'
        env:
          RELEASE_COMMIT: ${{ steps.release_state.outputs.release_commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          tag="v$RELEASE_VERSION"
          # The tag names the commit npm published, which is this one only when this run did the
          # publishing. Measured against the running commit, a recovery run from any later commit
          # would either refuse a correct tag or, worse, create a wrong one.
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_commit="$(git rev-list --max-count=1 "$tag")"
            if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
              echo "Tag $tag identifies $tag_commit, but $RELEASE_VERSION was published from $RELEASE_COMMIT." >&2
              exit 1
            fi
            echo "Tag $tag already identifies the published commit $RELEASE_COMMIT."
            exit 0
          fi
          if ! git cat-file -e "$RELEASE_COMMIT^{commit}"; then
            echo "The published commit $RELEASE_COMMIT is not in this clone, so $tag cannot be created." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$tag" --message "Release $RELEASE_VERSION" "$RELEASE_COMMIT"
          git push origin "refs/tags/$tag"

      # A publish returns before the version is readable. The 1.1.0 release published all six
      # packages and, one second later, `npm install` was told no `@ploaness/cli@1.1.0` existed:
      # the registry acknowledges a write on one path and serves reads from another, and the
      # lag between them is short, unstated, and not zero. So each package is polled, on the
      # abbreviated packument npm itself resolves against, until the release version is listed -
      # bounded, because a version still absent after minutes is a failed publish rather than a
      # slow one, and that must fail rather than wait.
      #
      # The install that follows is still the verdict. A per-package probe proves each exists; it
      # is the install that proves they resolve TOGETHER, which is the failure the publication
      # order exists to prevent. It is retried a few times for the same reason the probe exists:
      # the replica that answered the probe is not promised to be the one npm reads next.
      #
      # This runs on the recovery path too. A re-run after a failure of exactly this step used to
      # skip it - the publish had been skipped, so its outcome was not `success` - and recovered
      # the tag and the Release while proving nothing about whether the release installs.
      - name: 'Smoke-test the published release'
        if: >-
          steps.release_state.outputs.registry_published == 'true' ||
          steps.publish.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          attempts=30
          pause_seconds=10
          for package in $PUBLISH_ORDER; do
            name="${package/#ploaness-/@ploaness/}"
            packument="https://registry.npmjs.org/${name/\//%2F}"
            attempt=1
            until curl --silent --fail --header 'Accept: application/vnd.npm.install-v1+json' "$packument" \
                | node -e 'let body = ""; process.stdin.on("data", (chunk) => { body += chunk }).on("end", () => { process.exit(process.env.RELEASE_VERSION in (JSON.parse(body).versions ?? {}) ? 0 : 1) })'
            do
              if [ "$attempt" -ge "$attempts" ]; then
                echo "$name@$RELEASE_VERSION is still not readable from the registry after $attempts attempts." >&2
                exit 1
              fi
              echo "Waiting for $name@$RELEASE_VERSION to become readable (attempt $attempt of $attempts)."
              attempt=$((attempt + 1))
              sleep "$pause_seconds"
            done
            echo "$name@$RELEASE_VERSION is readable."
          done
          smoke="$RUNNER_TEMP/ploaness-smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke"
          cd "$smoke"
          npm init --yes > /dev/null
          install_attempts=3
          attempt=1
          until npm install --no-audit --no-fund "ploaness@$RELEASE_VERSION"; do
            if [ "$attempt" -ge "$install_attempts" ]; then
              echo "ploaness@$RELEASE_VERSION did not install after $install_attempts attempts." >&2
              exit 1
            fi
            echo "Retrying the install (attempt $attempt of $install_attempts failed)."
            attempt=$((attempt + 1))
            sleep "$pause_seconds"
          done
          installed="$(node -p "require('ploaness/package.json').version")"
          if [ "$installed" != "$RELEASE_VERSION" ]; then
            echo "The registry served ploaness $installed, not $RELEASE_VERSION." >&2
            exit 1
          fi
          ./node_modules/.bin/ploaness gates > /dev/null

      - name: 'Create metadata-only GitHub Release'
        if: >-
          always() &&
          steps.release_tag.outcome == 'success' &&
          (steps.release_state.outputs.registry_published == 'true' ||
           steps.publish.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -eu
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --verify-tag --title "ploaness // $RELEASE_VERSION" --notes ''
