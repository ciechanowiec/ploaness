# The native builds a Payload install needs. Left unapproved, pnpm exits non-zero on an otherwise
# successful install, which would read as a fixture failure rather than as the policy prompt it is.
# Both keys are required: onlyBuiltDependencies selects them, allowBuilds is what clears the prompt.
allowBuilds:
  esbuild: true
  sharp: true
onlyBuiltDependencies:
  - sharp
  - esbuild
  - unrs-resolver

# The fixture resolves the five from the packed tarballs rather than by name, so what it verifies is
# the artefacts this run produced rather than whatever the registry already serves. That does not
# change once they are published: a range would resolve to the previous release, which is the one
# thing a pre-publication check may not be blind to. An override applies at every depth, which is
# what makes the four internal packages resolve as well as the meta package. They belong here
# rather than in package.json: pnpm no longer reads a `pnpm` block from it.
overrides:
  ploaness: "file:__TARBALLS__/ploaness-1.0.0.tgz"
  "@ploaness/cli": "file:__TARBALLS__/ploaness-cli-1.0.0.tgz"
  "@ploaness/config": "file:__TARBALLS__/ploaness-config-1.0.0.tgz"
  "@ploaness/assets": "file:__TARBALLS__/ploaness-assets-1.0.0.tgz"
  "@ploaness/governance": "file:__TARBALLS__/ploaness-governance-1.0.0.tgz"
