# The native builds a Payload install needs. Left unapproved, pnpm exits non-zero on an otherwise
# successful install, which would read as a fixture failure rather than as the policy prompt it is.
# Both keys are required: onlyBuiltDependencies selects them, allowBuilds is what clears the prompt.
allowBuilds:
  esbuild: true
  sharp: true
onlyBuiltDependencies:
  - sharp
  - esbuild
  - unrs-resolver

# What the release-age gate requires, and the one exclusion it permits. The harness may be taken the day
# it ships, because a ploaness release is what a consumer's failing gates wait on; nothing else may be.
# The fixture resolves the harness from tarballs below, so the exclusion changes nothing here - it is
# present to prove the permitted shape passes, as the case that appends a foreign entry proves the rest.
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - 'ploaness'
  - '@ploaness/cli'
  - '@ploaness/config'
  - '@ploaness/assets'
  - '@ploaness/governance'
  - '@ploaness/runtime'

# The fixture resolves the six from the packed tarballs rather than by name, so what it verifies is
# the artefacts this run produced rather than whatever the registry already serves. That does not
# change once they are published: a range would resolve to the previous release, which is the one
# thing a pre-publication check may not be blind to. An override applies at every depth, which is
# what makes the five internal packages resolve as well as the meta package. They belong here
# rather than in package.json: pnpm no longer reads a `pnpm` block from it.
overrides:
  ploaness: "file:__TARBALLS__/ploaness-1.1.0.tgz"
  "@ploaness/cli": "file:__TARBALLS__/ploaness-cli-1.1.0.tgz"
  "@ploaness/config": "file:__TARBALLS__/ploaness-config-1.1.0.tgz"
  "@ploaness/assets": "file:__TARBALLS__/ploaness-assets-1.1.0.tgz"
  "@ploaness/governance": "file:__TARBALLS__/ploaness-governance-1.1.0.tgz"
  "@ploaness/runtime": "file:__TARBALLS__/ploaness-runtime-1.1.0.tgz"
